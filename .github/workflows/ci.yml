name: Student 2 - MLOps CI

on:
  push:
    branches: [main, student2/automation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-security:
    name: Python 3.11 tests and mandatory checks
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install ML requirements and CI checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install 'ruff==0.14.4' 'pip-audit==2.9.0' 'bandit==1.8.6'
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Check critical Python lint findings
        run: ruff check src pipelines tests --select E4,E7,E9,F
      - name: Run tests
        run: python -m pytest tests -q
      - name: Audit dependency vulnerabilities
        run: python -m pip_audit -r requirements.txt
      - name: Scan Python code for high-severity issues
        run: bandit -r src pipelines -ll
