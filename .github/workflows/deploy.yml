name: Phase 8 - Reviewed AWS deployment handoff

# Manual only. This workflow intentionally blocks until team approval and
# Student 3's tested deployment/rollback contract are available.
on:
  workflow_dispatch:
    inputs:
      evaluation_manifest:
        description: 'Run-scoped reports/automation/runs/.../evaluation_manifest.json'
        required: true
        type: string
      registered_model_uri:
        description: 'Pinned MLflow URI, e.g. models:/name/3'
        required: true
        type: string
      image_digest:
        description: 'Existing, tested ECR sha256 digest (not a mutable tag)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: phase8-production
  cancel-in-progress: false

jobs:
  production-approval-and-deployment:
    name: Protected review -> hosted gate -> image verification -> Student 3 deployment
    # Do not deploy directly from student's development branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      EVALUATION_MANIFEST: ${{ inputs.evaluation_manifest }}
      REGISTERED_MODEL_URI: ${{ inputs.registered_model_uri }}
      IMAGE_DIGEST: ${{ inputs.image_digest }}
      MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up tested Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Verify configuration is genuinely supplied
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MLFLOW_TRACKING_URI" && test -n "$MLFLOW_TRACKING_USERNAME" && test -n "$MLFLOW_TRACKING_PASSWORD"
          test -n "$AWS_REGION" && test -n "$ECR_REPOSITORY" && test -n "$EC2_INSTANCE_ID"
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo 'Invalid digest'; exit 1; }
          [[ "$REGISTERED_MODEL_URI" =~ ^models:/[^/]+/[1-9][0-9]*$ ]] || { echo 'Model version URI is not pinned'; exit 1; }
          [[ "$EVALUATION_MANIFEST" =~ ^reports/automation/runs/[^/]+/evaluation_manifest\.json$ ]] || { echo 'Bad manifest path'; exit 1; }
      - name: Install pinned model validation dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Verify hosted MLflow gate, exact registered model, and reviewer
        shell: bash
        run: |
          set -euo pipefail
          python -m pipelines.common.release \
            --evaluation-manifest "$EVALUATION_MANIFEST" \
            --registered-model-uri "$REGISTERED_MODEL_URI" \
            --image-digest "$IMAGE_DIGEST"
      - name: Get temporary AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: phase8-reviewed-release
          aws-region: ${{ vars.AWS_REGION }}
      - name: Check exact image exists in private ECR
        shell: bash
        run: |
          set -euo pipefail
          FOUND_DIGEST="$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageDigest=$IMAGE_DIGEST" --query 'imageDetails[0].imageDigest' --output text)"
          test "$FOUND_DIGEST" = "$IMAGE_DIGEST" || { echo 'Reviewed image digest not in ECR'; exit 1; }
          echo 'Pinned image digest exists in ECR.'
      - name: Deploy and health-check through Student 3 adapter (required)
        shell: bash
        run: |
          set -euo pipefail
          # This must be supplied/reviewed by Student 3. No silent success fallback.
          test -f scripts/student3_deploy.sh || { echo 'BLOCKED: Student 3 deployment/health/rollback script missing'; exit 1; }
          bash scripts/student3_deploy.sh
