random_forest:
  - n_estimators: 150
    max_depth: 12
    min_samples_leaf: 3

  - n_estimators: 250
    max_depth: 18
    min_samples_leaf: 5

xgboost:
  - n_estimators: 400
    max_depth: 3
    learning_rate: 0.05
    objective: "reg:squarederror"

  - n_estimators: 400
    max_depth: 3
    learning_rate: 0.05
    objective: "reg:absoluteerror"