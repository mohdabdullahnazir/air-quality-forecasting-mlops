# PIPELINE DEFINITION
# Name: student2-pm25-smoke-test
# Inputs:
#    sample_pm25: float [Default: 35.0]
components:
  comp-persistence-forecast:
    executorLabel: exec-persistence-forecast
    inputDefinitions:
      parameters:
        value:
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      parameters:
        Output:
          parameterType: NUMBER_DOUBLE
  comp-validate-pm25:
    executorLabel: exec-validate-pm25
    inputDefinitions:
      parameters:
        value:
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      parameters:
        Output:
          parameterType: NUMBER_DOUBLE
deploymentSpec:
  executors:
    exec-persistence-forecast:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - persistence_forecast
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.18.2'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef persistence_forecast(value: float) -> float:\n    print(f\"One-hour\
          \ persistence forecast: {value}\")\n    return value\n\n"
        image: python:3.11-slim
    exec-validate-pm25:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - validate_pm25
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.18.2'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef validate_pm25(value: float) -> float:\n    if value < 0:\n  \
          \      raise ValueError(\"PM2.5 cannot be negative\")\n    print(f\"Validated\
          \ PM2.5: {value}\")\n    return value\n\n"
        image: python:3.11-slim
pipelineInfo:
  name: student2-pm25-smoke-test
root:
  dag:
    tasks:
      persistence-forecast:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-persistence-forecast
        dependentTasks:
        - validate-pm25
        inputs:
          parameters:
            value:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: validate-pm25
        taskInfo:
          name: persistence-forecast
      validate-pm25:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-validate-pm25
        inputs:
          parameters:
            value:
              componentInputParameter: sample_pm25
        taskInfo:
          name: validate-pm25
  inputDefinitions:
    parameters:
      sample_pm25:
        defaultValue: 35.0
        isOptional: true
        parameterType: NUMBER_DOUBLE
schemaVersion: 2.1.0
sdkVersion: kfp-2.18.2
